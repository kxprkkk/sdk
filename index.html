    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glassDark: 'rgba(15, 23, 42, 0.65)',
                        glassLight: 'rgba(255, 255, 255, 0.1)',
                        glassBorder: 'rgba(255, 255, 255, 0.15)',
                    }
                }
            }
        }
    </script>

            font-family: 'Inter', sans-serif;

            min-height: 100vh;

        .glass-card {

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.1);

    <!-- JavaScript Sudoku & PWA Logic -->
    <script>
        // --- GAME STATE & VARIABLES ---
        let currentDifficulty = 'medium';
        let solutionGrid = Array(81).fill(0);
        let puzzleGrid = Array(81).fill(0);
        let userGrid = Array(81).fill(0);
        let notesGrid = Array(81).fill(0).map(() => new Set());
        let initialClues = Array(81).fill(false);
        
        let selectedCellIndex = null;
        let notesMode = false;
        let moveHistory = [];
        let timerSeconds = 0;
        let timerInterval = null;
        let isGameCompleted = false;

        // Statistics Storage Keys
        const STORAGE_COMPLETED_KEY = 'glass_sudoku_completed_count';
        const STORAGE_BEST_TIMES_KEY = 'glass_sudoku_best_times';

        // Difficulty Clues Count Map
        const DIFFICULTY_CLUES = {
            easy: 38,
            medium: 30,
            hard: 24,
            expert: 21
        };

        // --- SUDOKU GENERATOR & SOLVER ALGORITHM ---
        function generateSudoku(difficulty) {
            // 1. Generate fully solved valid grid
            let board = Array(81).fill(0);
            solveSudokuHelper(board);
            let solved = [...board];

            // 2. Remove numbers based on difficulty while preserving uniqueness
            let cluesCount = DIFFICULTY_CLUES[difficulty] || 30;
            let removeCount = 81 - cluesCount;
            let indices = Array.from({length: 81}, (_, i) => i);
            // Shuffle indices
            indices.sort(() => Math.random() - 0.5);

            let puzzle = [...solved];
            let removed = 0;

            for (let idx of indices) {
                if (removed >= removeCount) break;
                let temp = puzzle[idx];
                puzzle[idx] = 0;

                // Verify if puzzle still has a unique solution
                let copy = [...puzzle];
                if (!hasUniqueSolution(copy)) {
                    puzzle[idx] = temp; // restore if not unique
                } else {
                    removed++;
                }
            }

            return { puzzle, solution: solved };
        }

        function solveSudokuHelper(board) {
            let emptyIdx = board.indexOf(0);
            if (emptyIdx === -1) return true;

            let row = Math.floor(emptyIdx / 9);
            let col = emptyIdx % 9;

            let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            nums.sort(() => Math.random() - 0.5); // randomize for unique boards

            for (let num of nums) {
                if (isValidPlacement(board, row, col, num)) {
                    board[emptyIdx] = num;
                    if (solveSudokuHelper(board)) return true;
                    board[emptyIdx] = 0;
                }
            }
            return false;
        }

        function isValidPlacement(board, row, col, num) {
            for (let i = 0; i < 9; i++) {
                // Check row
                if (board[row * 9 + i] === num && i !== col) return false;
                // Check col
                if (board[i * 9 + col] === num && i !== row) return false;
            }
            // Check 3x3 box
            let startRow = Math.floor(row / 3) * 3;
            let startCol = Math.floor(col / 3) * 3;
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    let idx = (startRow + r) * 9 + (startCol + c);
                    let currentRow = Math.floor(idx / 9);
                    let currentCol = idx % 9;
                    if (board[idx] === num && (currentRow !== row || currentCol !== col)) {
                        return false;
                    }
                }
            }
            return true;
        }

        function hasUniqueSolution(board) {
            let solutions = 0;
            function countSolutions(b) {
                let empty = b.indexOf(0);
                if (empty === -1) {
                    solutions++;
                    return;
                }
                if (solutions >= 2) return; // Stop if multiple found

                let row = Math.floor(empty / 9);
                let col = empty % 9;
                for (let num = 1; num <= 9; num++) {
                    if (isValidPlacement(b, row, col, num)) {
                        b[empty] = num;
                        countSolutions(b);
                        b[empty] = 0;
                        if (solutions >= 2) return;
                    }
                }
            }
            countSolutions([...board]);
            return solutions === 1;
        }

        // --- UI INITIALIZATION & RENDERING ---
        function initBoardUI() {
            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = '';

            for (let i = 0; i < 81; i++) {
                let cell = document.createElement('div');
                cell.className = 'sudoku-cell relative flex flex-col items-center justify-center cursor-pointer select-none text-lg font-semibold rounded-lg m-[1px] aspect-square';
                cell.dataset.index = i;

                // Add 3x3 grid thicker borders
                let row = Math.floor(i / 9);
                let col = i % 9;
                if ((col + 1) % 3 === 0 && col < 8) {
                    cell.classList.add('border-r-thick');
                }
                if ((row + 1) % 3 === 0 && row < 8) {
                    cell.classList.add('border-b-thick');
                }

                cell.addEventListener('click', () => selectCell(i));
                boardEl.appendChild(cell);
            }
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.sudoku-cell');
            cells.forEach((cell, i) => {
                let val = userGrid[i];
                let isInitial = initialClues[i];
                let isSelected = selectedCellIndex === i;
                let hasConflict = checkCellConflict(i);

                // Reset classes
                cell.className = 'sudoku-cell relative flex flex-col items-center justify-center cursor-pointer select-none text-lg font-semibold rounded-lg m-[1px] aspect-square';

                // Re-apply 3x3 borders
                let row = Math.floor(i / 9);
                let col = i % 9;
                if ((col + 1) % 3 === 0 && col < 8) cell.classList.add('border-r-thick');
                if ((row + 1) % 3 === 0 && row < 8) cell.classList.add('border-b-thick');

                // Styling based on state
                if (isSelected) {
                    cell.classList.add('bg-blue-600/40', 'ring-2', 'ring-blue-400', 'z-10');
                } else if (selectedCellIndex !== null && (Math.floor(selectedCellIndex / 9) === row || selectedCellIndex % 9 === col || (Math.floor(selectedCellIndex/27) === Math.floor(row/3) && Math.floor((selectedCellIndex%9)/3) === Math.floor(col/3)))) {
                    cell.classList.add('bg-blue-500/10');
                }

                // Highlight identical numbers if cell selected
                if (selectedCellIndex !== null && userGrid[selectedCellIndex] !== 0 && userGrid[selectedCellIndex] === val) {
                    cell.classList.add('bg-blue-500/25', 'text-blue-200');
                }

                // Conflicts highlight
                if (hasConflict && val !== 0) {
                    cell.classList.add('bg-rose-500/30', 'text-rose-300', 'animate-pulse');
                }

                // Render content
                if (val !== 0) {
                    cell.innerHTML = `<span class="${isInitial ? 'text-white font-bold' : 'text-blue-300 font-medium'}">${val}</span>`;
                } else if (notesGrid[i].size > 0) {
                    // Render 3x3 mini grid for notes
                    let notesHtml = '<div class="grid grid-cols-3 w-full h-full p-0.5 text-[9px] text-slate-400 font-mono leading-none">';
                    for (let n = 1; n <= 9; n++) {
                        let hasNote = notesGrid[i].has(n);
                        notesHtml += `<div class="flex items-center justify-center">${hasNote ? n : ''}</div>`;
                    }
                    notesHtml += '</div>';
                    cell.innerHTML = notesHtml;
                } else {
                    cell.innerHTML = '';
                }
            });
        }

        // --- GAME CONTROLS & ACTIONS ---
        function selectCell(index) {
            selectedCellIndex = index;
            renderBoard();
        }

        function inputNumber(num) {
            if (selectedCellIndex === null) return;
            if (initialClues[selectedCellIndex]) return; // Cannot modify initial clues

            let prevVal = userGrid[selectedCellIndex];
            let prevNotes = new Set(notesGrid[selectedCellIndex]);

            if (notesMode) {
                // Toggle note
                if (userGrid[selectedCellIndex] === 0) {
                    if (notesGrid[selectedCellIndex].has(num)) {
                        notesGrid[selectedCellIndex].delete(num);
                    } else {
                        notesGrid[selectedCellIndex].add(num);
                    }
                    recordMove({ index: selectedCellIndex, type: 'note', prevNotes, newNotes: new Set(notesGrid[selectedCellIndex]) });
                }
            } else {
                // Enter number
                if (userGrid[selectedCellIndex] === num) {
                    userGrid[selectedCellIndex] = 0; // Toggle off if same
                } else {
                    userGrid[selectedCellIndex] = num;
                    notesGrid[selectedCellIndex].clear(); // clear notes on number fill
                }

                recordMove({ index: selectedCellIndex, type: 'value', prevVal, newVal: userGrid[selectedCellIndex], prevNotes });
                checkVictoryCondition();
            }
            renderBoard();
        }

        function eraseCell() {
            if (selectedCellIndex === null || initialClues[selectedCellIndex]) return;
            let prevVal = userGrid[selectedCellIndex];
            let prevNotes = new Set(notesGrid[selectedCellIndex]);

            if (prevVal !== 0 || prevNotes.size > 0) {
                userGrid[selectedCellIndex] = 0;
                notesGrid[selectedCellIndex].clear();
                recordMove({ index: selectedCellIndex, type: 'erase', prevVal, prevNotes });
                renderBoard();
            }
        }

        function toggleNotesMode() {
            notesMode = !notesMode;
            const btn = document.getElementById('notes-btn');
            const indicator = document.getElementById('notes-indicator');
            if (notesMode) {
                btn.classList.add('ring-2', 'ring-indigo-400', 'bg-indigo-500/20');
                indicator.classList.remove('bg-slate-500');
                indicator.classList.add('bg-indigo-400', 'animate-ping');
            } else {
                btn.classList.remove('ring-2', 'ring-indigo-400', 'bg-indigo-500/20');
                indicator.classList.remove('bg-indigo-400', 'animate-ping');
                indicator.classList.add('bg-slate-500');
            }
        }

        function undoMove() {
            if (moveHistory.length === 0) return;
            let lastMove = moveHistory.pop();

            if (lastMove.type === 'value' || lastMove.type === 'erase') {
                userGrid[lastMove.index] = lastMove.prevVal;
                if (lastMove.prevNotes) notesGrid[lastMove.index] = lastMove.prevNotes;
            } else if (lastMove.type === 'note') {
                notesGrid[lastMove.index] = lastMove.prevNotes;
            }
            selectedCellIndex = lastMove.index;
            renderBoard();
        }

        function recordMove(move) {
            moveHistory.push(move);
            if (moveHistory.length > 50) moveHistory.shift();
        }

        function giveHint() {
            // Find empty or incorrect cells
            let candidateIndices = [];
            for (let i = 0; i < 81; i++) {
                if (userGrid[i] !== solutionGrid[i]) {
                    candidateIndices.push(i);
                }
            }
            if (candidateIndices.length === 0) return;

            // Pick random incorrect/empty cell
            let targetIdx = candidateIndices[Math.floor(Math.random() * candidateIndices.length)];
            userGrid[targetIdx] = solutionGrid[targetIdx];
            notesGrid[targetIdx].clear();
            initialClues[targetIdx] = true; // lock hint cell
            selectedCellIndex = targetIdx;
            
            showToast('Podpowiedź została odkryta!', 'fa-lightbulb', 'text-yellow-400');
            renderBoard();
            checkVictoryCondition();
        }

        function checkCellConflict(idx) {
            let val = userGrid[idx];
            if (val === 0) return false;
            let row = Math.floor(idx / 9);
            let col = idx % 9;

            // Check row and col conflicts
            for (let i = 0; i < 9; i++) {
                let rIdx = row * 9 + i;
                if (rIdx !== idx && userGrid[rIdx] === val) return true;
                let cIdx = i * 9 + col;
                if (cIdx !== idx && userGrid[cIdx] === val) return true;
            }

            // Check box conflicts
            let startRow = Math.floor(row / 3) * 3;
            let startCol = Math.floor(col / 3) * 3;
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    let boxIdx = (startRow + r) * 9 + (startCol + c);
                    if (boxIdx !== idx && userGrid[boxIdx] === val) return true;
                }
            }
            return false;
        }

        function checkVictoryCondition() {
            if (isGameCompleted) return;
            for (let i = 0; i < 81; i++) {
                if (userGrid[i] !== solutionGrid[i]) return;
            }

            // Victory!
            isGameCompleted = true;
            clearInterval(timerInterval);
            incrementCompletedCounter();
            triggerVictoryEffects();
        }

        function triggerVictoryEffects() {
            // Confetti
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });

            document.getElementById('final-time').innerText = formatTime(timerSeconds);
            document.getElementById('victory-overlay').classList.remove('opacity-0', 'pointer-events-none');
        }

        // --- TIMER & STATS ---
        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!isGameCompleted) {
                    timerSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = formatTime(timerSeconds);
        }

        function formatTime(totalSecs) {
            let mins = Math.floor(totalSecs / 60);
            let secs = totalSecs % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function incrementCompletedCounter() {
            let count = parseInt(localStorage.getItem(STORAGE_COMPLETED_KEY) || '0') + 1;
            localStorage.setItem(STORAGE_COMPLETED_KEY, count);
            updateCounterDisplay();
        }

        function updateCounterDisplay() {
            let count = localStorage.getItem(STORAGE_COMPLETED_KEY) || '0';
            document.getElementById('completed-counter').innerText = count;
            document.getElementById('modal-completed-total').innerText = count;
        }

        function changeDifficulty(diff) {
            currentDifficulty = diff;
            document.getElementById('current-difficulty-badge').innerText = diff;
            document.getElementById('modal-difficulty').innerText = diff;
            startNewGame();
        }

        function startNewGame() {
            isGameCompleted = false;
            document.getElementById('victory-overlay').classList.add('opacity-0', 'pointer-events-none');
            
            // Generate puzzle
            let generated = generateSudoku(currentDifficulty);
            puzzleGrid = generated.puzzle;
            solutionGrid = generated.solution;
            userGrid = [...puzzleGrid];
            notesGrid = Array(81).fill(0).map(() => new Set());
            initialClues = puzzleGrid.map(val => val !== 0);
            
            selectedCellIndex = null;
            moveHistory = [];
            
            initBoardUI();
            renderBoard();
            startTimer();
            showToast(`Wygenerowano nowy poziom (${currentDifficulty})`, 'fa-bolt', 'text-blue-400');
        }

        // --- MODALS & TOASTS ---
        function openStatsModal() {
            document.getElementById('modal-completed-total').innerText = localStorage.getItem(STORAGE_COMPLETED_KEY) || '0';
            document.getElementById('modal-difficulty').innerText = currentDifficulty;
            document.getElementById('modal-best-time').innerText = timerSeconds > 0 ? formatTime(timerSeconds) : '--:--';
            document.getElementById('stats-modal').classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function showToast(text, iconClass = 'fa-info-circle', iconColor = 'text-blue-450') {
            const toast = document.getElementById('toast-container');
            const textEl = document.getElementById('toast-text');
            const iconEl = document.getElementById('toast-icon');

            textEl.innerText = text;
            iconEl.className = `fa-solid ${iconClass} ${iconColor}`;

            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }

        // Keyboard navigation listener
        window.addEventListener('keydown', (e) => {
            if (selectedCellIndex === null) return;
            if (e.key >= '1' && e.key <= '9') {
                inputNumber(parseInt(e.key));
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                eraseCell();
            } else if (e.key === 'ArrowUp' && selectedCellIndex >= 9) {
                selectCell(selectedCellIndex - 9);
            } else if (e.key === 'ArrowDown' && selectedCellIndex < 72) {
                selectCell(selectedCellIndex + 9);
            } else if (e.key === 'ArrowLeft' && selectedCellIndex % 9 > 0) {
                selectCell(selectedCellIndex - 1);
            } else if (e.key === 'ArrowRight' && selectedCellIndex % 9 < 8) {
                selectCell(selectedCellIndex + 1);
            }
        });

        // Initialize App on Load
        window.onload = function() {
            updateCounterDisplay();
            initBoardUI();
            startNewGame();
        };
    </script>
</body>
</html>
